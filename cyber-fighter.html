<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CYBER_FIGHTER.sh | 3D Alpha</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00f2ff; font-size: 24px; }
        .ui-panel { border: 1px solid rgba(0, 242, 255, 0.3); background: rgba(0, 242, 255, 0.05); backdrop-filter: blur(5px); }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="hud">
        <div class="crosshair">+</div>
        <div class="absolute top-10 left-10 ui-panel p-4 rounded">
            <div class="text-[10px] text-cyan-400 uppercase tracking-widest">System_Status</div>
            <div class="text-white font-bold text-lg">OPTIMAL</div>
            <div class="w-32 h-1 bg-slate-800 mt-2"><div class="h-full bg-cyan-400 w-full"></div></div>
        </div>
        <div class="absolute bottom-10 right-10 ui-panel p-6 rounded text-right">
            <div class="text-[10px] text-cyan-400 mb-1">PLASMA_CELL</div>
            <div class="text-3xl text-white font-bold">24 / 100</div>
            <div class="text-[10px] text-green-400 mt-1 animate-pulse">ALT_FIRE: [READY]</div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, gun;
let bullets = [];
let targets = [];
let obstacles = [];
let velocity = new THREE.Vector3();
let moveState = { fwd: false, bkwd: false, left: false, right: false };

const keyMap = { 
    'KeyW': 'fwd', 'KeyS': 'bkwd', 'KeyA': 'left', 'KeyD': 'right', 
    'KeyZ': 'fwd', // Pour les claviers AZERTY
    'ArrowUp': 'fwd', 'ArrowDown': 'bkwd', 'ArrowLeft': 'left', 'ArrowRight': 'right' 
};

init();
animate();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010409);
    scene.fog = new THREE.FogExp2(0x010409, 0.04);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 5); // Taille humaine fixe
    camera.rotation.order = 'YXZ'; // Important pour éviter les bugs de rotation

    // Lumières
    scene.add(new THREE.AmbientLight(0x404040, 0.8));
    const hemiLight = new THREE.HemisphereLight(0x00f2ff, 0xff0055, 0.5);
    scene.add(hemiLight);

    // Sol Techno
    const grid = new THREE.GridHelper(200, 40, 0x00f2ff, 0x020617);
    scene.add(grid);

    // L'ARME
    const gunGeo = new THREE.BoxGeometry(0.12, 0.18, 0.6);
    const gunMat = new THREE.MeshPhongMaterial({ color: 0x111111, emissive: 0x00f2ff, emissiveIntensity: 0.5 });
    gun = new THREE.Mesh(gunGeo, gunMat);
    scene.add(gun);

    // ENNEMIS LUMINEUX
    for(let i=0; i<12; i++) createTarget();

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // CONTRÔLES SOURIS (Axe Y Corrigé)
    document.body.onclick = () => { document.body.requestPointerLock(); };
    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement) {
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002; // Standard : Souris Haut = Regarde Haut
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
        }
    });

    // CONTRÔLES CLAVIER
    document.addEventListener('keydown', (e) => { if(keyMap[e.code]) moveState[keyMap[e.code]] = true; });
    document.addEventListener('keyup', (e) => { if(keyMap[e.code]) moveState[keyMap[e.code]] = false; });

    window.onmousedown = () => { if(document.pointerLockElement) shoot(); };
}

function createTarget() {
    // Sphère rouge brillante
    const tGeo = new THREE.SphereGeometry(0.7, 16, 16);
    const tMat = new THREE.MeshStandardMaterial({ 
        color: 0xff0000, 
        emissive: 0xff0000, 
        emissiveIntensity: 2,
        roughness: 0
    });
    const t = new THREE.Mesh(tGeo, tMat);
    
    // Position aléatoire au sol
    t.position.set((Math.random()-0.5)*60, 1.2, (Math.random()-0.5)*60);
    
    // Petite lumière attachée à la cible pour qu'on la voit de loin
    const light = new THREE.PointLight(0xff0000, 1, 5);
    t.add(light);
    
    scene.add(t);
    targets.push(t);
}

function shoot() {
    const b = new THREE.Mesh(
        new THREE.CylinderGeometry(0.02, 0.02, 0.8), 
        new THREE.MeshBasicMaterial({color: 0x00f2ff})
    );
    b.rotation.copy(camera.rotation);
    b.rotation.x += Math.PI/2;
    b.position.copy(camera.position);
    
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    b.userData.velocity = dir.multiplyScalar(1.5);
    scene.add(b);
    bullets.push(b);
}

function animate() {
    requestAnimationFrame(animate);

    // LOGIQUE DE MOUVEMENT (CORRIGÉE)
    const speed = 0.15;
    const dirZ = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    const dirX = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    
    // On annule la composante Y pour ne pas s'envoler
    dirZ.y = 0; dirZ.normalize();
    dirX.y = 0; dirX.normalize();

    if (moveState.fwd) camera.position.addScaledVector(dirZ, speed);
    if (moveState.bkwd) camera.position.addScaledVector(dirZ, -speed);
    if (moveState.left) camera.position.addScaledVector(dirX, -speed);
    if (moveState.right) camera.position.addScaledVector(dirX, speed);

    // Garder le joueur au sol (Y = 1.6)
    camera.position.y = 1.6;

    // Animation des cibles (elles flottent et brillent)
    targets.forEach(t => {
        t.position.y = 1.2 + Math.sin(Date.now() * 0.003) * 0.3;
        t.material.emissiveIntensity = 1 + Math.sin(Date.now() * 0.005);
    });

    // Arme
    gun.position.copy(camera.position);
    gun.quaternion.copy(camera.quaternion);
    gun.translateX(0.35); gun.translateY(-0.25); gun.translateZ(-0.6);

    // Projectiles
    bullets.forEach((b, i) => {
        b.position.add(b.userData.velocity);
        targets.forEach((t, ti) => {
            if(b.position.distanceTo(t.position) < 1.2) {
                scene.remove(t); targets.splice(ti, 1); createTarget();
                scene.remove(b); bullets.splice(i, 1);
            }
        });
        if(b.position.distanceTo(camera.position) > 100) { scene.remove(b); bullets.splice(i, 1); }
    });

    renderer.render(scene, camera);
}
    </script>
</body>
</html>
