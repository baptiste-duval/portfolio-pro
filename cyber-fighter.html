<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CYBER_FIGHTER.sh | 3D Alpha</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00f2ff; font-size: 24px; }
        .ui-panel { border: 1px solid rgba(0, 242, 255, 0.3); background: rgba(0, 242, 255, 0.05); backdrop-filter: blur(5px); }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="hud">
        <div class="crosshair">+</div>
        <div class="absolute top-10 left-10 ui-panel p-4 rounded">
            <div class="text-[10px] text-cyan-400 uppercase tracking-widest">System_Status</div>
            <div class="text-white font-bold text-lg">OPTIMAL</div>
            <div class="w-32 h-1 bg-slate-800 mt-2"><div class="h-full bg-cyan-400 w-full"></div></div>
        </div>
        <div class="absolute bottom-10 right-10 ui-panel p-6 rounded text-right">
            <div class="text-[10px] text-cyan-400 mb-1">PLASMA_CELL</div>
            <div class="text-3xl text-white font-bold">24 / 100</div>
            <div class="text-[10px] text-green-400 mt-1 animate-pulse">ALT_FIRE: [READY]</div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, gun;
        let bullets = [];
        let targets = [];
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();

        init();
        animate();

        function init() {
            // 1. SCÈNE & CAMÉRA
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617);
            scene.fog = new THREE.FogExp2(0x020617, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 1.6; // Taille humaine

            // 2. LUMIÈRES (Néon Style)
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x00f2ff, 2, 50);
            pointLight.position.set(0, 5, 0);
            scene.add(pointLight);

            // 3. SOL (Grille néon)
            const floorGeo = new THREE.PlaneGeometry(200, 200);
            const floorMat = new THREE.MeshPhongMaterial({ 
                color: 0x050505, 
                emissive: 0x00f2ff, 
                emissiveIntensity: 0.05,
                side: THREE.DoubleSide 
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const grid = new THREE.GridHelper(200, 50, 0x00f2ff, 0x001111);
            scene.add(grid);

            // 4. L'ARME (Un bloc futuriste attaché à la caméra)
            const gunGeo = new THREE.BoxGeometry(0.1, 0.2, 0.5);
            const gunMat = new THREE.MeshPhongMaterial({ color: 0x222222, emissive: 0x00f2ff, emissiveIntensity: 0.2 });
            gun = new THREE.Mesh(gunGeo, gunMat);
            scene.add(gun);

            // 5. ENNEMIS (Sphères flottantes)
            for(let i=0; i<10; i++) {
                createTarget();
            }

            // RENDERER
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // CONTRÔLES SOURIS
            document.body.requestPointerLock = document.body.requestPointerLock || document.body.mozRequestPointerLock;
            document.body.onclick = () => { document.body.requestPointerLock(); };
            
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                }
            });

            // TIR
            window.onmousedown = () => { if(document.pointerLockElement) shoot(); };
        }

        function createTarget() {
            const geo = new THREE.IcosahedronGeometry(0.5, 0);
            const mat = new THREE.MeshPhongMaterial({ color: 0xff0055, emissive: 0xff0055, wireframe: true });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set((Math.random()-0.5)*40, 1 + Math.random()*3, (Math.random()-0.5)*40);
            scene.add(mesh);
            targets.push(mesh);
        }

        function shoot() {
            const bulletGeo = new THREE.SphereGeometry(0.05, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0x00f2ff });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            
            bullet.position.copy(camera.position);
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            bullet.userData.velocity = dir.multiplyScalar(0.8);
            
            scene.add(bullet);
            bullets.push(bullet);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Animation de l'arme (suit la caméra)
            gun.position.copy(camera.position);
            gun.quaternion.copy(camera.quaternion);
            gun.translateX(0.3);
            gun.translateY(-0.25);
            gun.translateZ(-0.5);

            // Update Bullets
            bullets.forEach((b, index) => {
                b.position.add(b.userData.velocity);
                if(b.position.distanceTo(camera.position) > 100) {
                    scene.remove(b);
                    bullets.splice(index, 1);
                }

                // Collision simple
                targets.forEach((t, tIndex) => {
                    if(b.position.distanceTo(t.position) < 0.6) {
                        scene.remove(t);
                        targets.splice(tIndex, 1);
                        createTarget(); // Respawn
                    }
                });
            });

            // Animation cibles
            targets.forEach(t => {
                t.rotation.y += 0.01;
                t.position.y += Math.sin(Date.now() * 0.002) * 0.005;
            });

            renderer.render(scene, camera);
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
