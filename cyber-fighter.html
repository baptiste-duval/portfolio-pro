<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CYBER_FORTNITE | Build & Survive | Fixed</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 10; }
        .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; border: 2px solid #00f2ff; border-radius: 50%; }
        .bar-container { height: 10px; background: rgba(0,0,0,0.5); border: 1px solid #333; width: 250px; border-radius: 5px; overflow: hidden; }
        #hp-fill { height: 100%; background: #22c55e; width: 100%; transition: 0.2s; }
        #sh-fill { height: 100%; background: #3b82f6; width: 100%; transition: 0.2s; }
        .slot { width: 70px; height: 70px; border: 2px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; font-size: 9px; border-radius: 10px; flex-direction: column; color: #aaa; }
        .active { border-color: #00f2ff; background: rgba(0,242,255,0.1); color: #fff; box-shadow: 0 0 15px rgba(0,242,255,0.2); }
        #flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: red; opacity: 0; pointer-events: none; z-index: 20; }
    </style>
</head>
<body>
    <div id="flash"></div>
    <div id="hud">
        <div class="flex justify-between">
            <div class="space-y-2">
                <div class="bar-container"><div id="hp-fill"></div></div>
                <div class="bar-container"><div id="sh-fill"></div></div>
                <div class="text-[10px] text-white">HEALTH: <span id="hp-val">100</span> | SHIELD: <span id="sh-val">100</span></div>
            </div>
            <div class="text-right text-cyan-400 text-xs uppercase" id="ammo-display">AMMO: 30 / 180</div>
        </div>

        <div class="flex gap-3 justify-center mb-6">
            <div id="s1" class="slot active"><span>1</span><b>PISTOL</b></div>
            <div id="s2" class="slot"><span>2</span><b>RIFLE</b></div>
            <div id="s3" class="slot"><span>3</span><b>SHOTGUN</b></div>
            <div id="s4" class="slot"><span>4</span><b>SNIPER</b></div>
            <div id="s5" class="slot"><span>5</span><b>BUILD</b></div>
        </div>
    </div>
    <div class="crosshair"></div>

    <script>
        let scene, camera, renderer, gun;
        let bullets = [], enemyBullets = [], targets = [], walls = [];
        let player = { hp: 100, sh: 100, mode: 'weapon', weapon: 'rifle', ammo: 30, reserve: 180, magSize: 30 };
        let moveState = { fwd: false, bkwd: false, left: false, right: false };
        let isReloading = false, lastShootTime = 0;

        const WEAPONS = {
            pistol: { rate: 250, ammo: 12, mag: 12, res: 72, recoil: 0.02 },
            rifle: { rate: 100, ammo: 30, mag: 30, res: 180, recoil: 0.03 },
            shotgun: { rate: 800, ammo: 6, mag: 6, res: 30, recoil: 0.1 },
            sniper: { rate: 1500, ammo: 5, mag: 5, res: 20, recoil: 0.2 }
        };

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x010409);
            scene.fog = new THREE.FogExp2(0x010409, 0.04);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 10);
            camera.rotation.order = 'YXZ';

            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const grid = new THREE.GridHelper(200, 60, 0x00f2ff, 0x050505);
            scene.add(grid);

            // Arme
            const gunGeo = new THREE.BoxGeometry(0.15, 0.2, 0.7);
            const gunMat = new THREE.MeshStandardMaterial({color: 0x111111, emissive: 0x00f2ff, emissiveIntensity: 0.5});
            gun = new THREE.Mesh(gunGeo, gunMat);
            scene.add(gun);

            for(let i=0; i<10; i++) spawnEnemy();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Controles
            document.body.onclick = () => document.body.requestPointerLock();
            document.addEventListener('mousemove', (e) => {
                if(document.pointerLockElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                }
            });

            document.addEventListener('keydown', (e) => {
                if(e.code === 'KeyW' || e.code === 'KeyZ') moveState.fwd = true;
                if(e.code === 'KeyS') moveState.bkwd = true;
                if(e.code === 'KeyA' || e.code === 'KeyQ') moveState.left = true;
                if(e.code === 'KeyD') moveState.right = true;
                if(e.code === 'KeyR') reload();
                if(['Digit1','Digit2','Digit3','Digit4','Digit5'].includes(e.code)) switchSlot(e.code.replace('Digit',''));
            });

            document.addEventListener('keyup', (e) => {
                if(e.code === 'KeyW' || e.code === 'KeyZ') moveState.fwd = false;
                if(e.code === 'KeyS') moveState.bkwd = false;
                if(e.code === 'KeyA' || e.code === 'KeyQ') moveState.left = false;
                if(e.code === 'KeyD') moveState.right = false;
            });

            window.onmousedown = () => {
                if(document.pointerLockElement) {
                    if(player.mode === 'weapon') shoot();
                    else build();
                }
            };
        }

        function switchSlot(n) {
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
            document.getElementById('s'+n).classList.add('active');
            
            if(n == 5) {
                player.mode = 'build';
                gun.visible = false;
            } else {
                player.mode = 'weapon';
                gun.visible = true;
                const types = ['pistol', 'rifle', 'shotgun', 'sniper'];
                player.weapon = types[n-1];
                updateAmmoHUD();
            }
        }

        function reload() {
            const w = WEAPONS[player.weapon];
            if(isReloading || w.ammo === w.mag || w.res === 0) return;
            
            isReloading = true;
            gun.rotation.x = -Math.PI / 4; // Animation abaissement
            
            setTimeout(() => {
                const needed = w.mag - w.ammo;
                const transfer = Math.min(needed, w.res);
                w.ammo += transfer;
                w.res -= transfer;
                gun.rotation.x = 0;
                isReloading = false;
                updateAmmoHUD();
            }, 1200);
        }

        function shoot() {
            const w = WEAPONS[player.weapon];
            const now = Date.now();
            if(isReloading || now - lastShootTime < w.rate) return;
            
            if(w.ammo <= 0) { reload(); return; }

            // 1. CREER LE TIR
            w.ammo--;
            lastShootTime = now;
            const b = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({color: 0x00f2ff}));
            b.position.copy(camera.position);
            const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
            b.userData.vel = dir.multiplyScalar(2);
            scene.add(b);
            bullets.push(b);

            // 2. APPLIQUER LE RECUL (APRES le tir)
            camera.rotation.x += w.recoil;
            gun.position.z += 0.2; // Effet visuel de kick

            updateAmmoHUD();
        }

        function build() {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 0.2), new THREE.MeshStandardMaterial({color: 0x00f2ff, transparent: true, opacity: 0.6, emissive: 0x00f2ff}));
            const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
            wall.position.copy(camera.position).addScaledVector(dir, 4);
            wall.position.y = 1.5;
            wall.rotation.y = camera.rotation.y;
            scene.add(wall);
            walls.push(wall);
        }

        function spawnEnemy() {
            const e = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({color: 0xff0055, emissive: 0xff0000}));
            e.position.set((Math.random()-0.5)*100, 1, (Math.random()-0.5)*100);
            e.userData = { lastShot: 0 };
            scene.add(e);
            targets.push(e);
        }

        function updateAmmoHUD() {
            const w = WEAPONS[player.weapon];
            document.getElementById('ammo-display').innerText = `AMMO: ${w.ammo} / ${w.res}`;
        }

        function animate() {
            requestAnimationFrame(animate);

            // Mouvement
            const speed = 0.15;
            const move = new THREE.Vector3();
            if(moveState.fwd) move.z -= 1;
            if(moveState.bkwd) move.z += 1;
            if(moveState.left) move.x -= 1;
            if(moveState.right) move.x += 1;
            move.applyQuaternion(camera.quaternion);
            move.y = 0;
            camera.position.addScaledVector(move.normalize(), speed);

            // Placement de l'arme
            if(player.mode === 'weapon') {
                gun.position.copy(camera.position);
                gun.quaternion.copy(camera.quaternion);
                gun.translateX(0.35); gun.translateY(-0.25); gun.translateZ(-0.6);
            }

            // Balles joueur
            bullets.forEach((b, i) => {
                b.position.add(b.userData.vel);
                targets.forEach((t, ti) => {
                    if(b.position.distanceTo(t.position) < 1.5) {
                        scene.remove(t); targets.splice(ti,1); spawnEnemy();
                        scene.remove(b); bullets.splice(i,1);
                    }
                });
            });

            // IA Ennemis (Ils tirent sur toi)
            const now = Date.now();
            targets.forEach(t => {
                if(t.position.distanceTo(camera.position) < 40 && now - t.userData.lastShot > 2500) {
                    t.userData.lastShot = now;
                    const eb = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshBasicMaterial({color: 0xff0000}));
                    eb.position.copy(t.position);
                    const eDir = new THREE.Vector3().subVectors(camera.position, t.position).normalize();
                    eb.userData.vel = eDir.multiplyScalar(0.4);
                    scene.add(eb);
                    enemyBullets.push(eb);
                }
            });

            enemyBullets.forEach((eb, i) => {
                eb.position.add(eb.userData.vel);
                if(eb.position.distanceTo(camera.position) < 1.2) {
                    player.sh -= 10;
                    if(player.sh < 0) { player.hp += player.sh; player.sh = 0; }
                    document.getElementById('sh-fill').style.width = player.sh + '%';
                    document.getElementById('hp-fill').style.width = player.hp + '%';
                    document.getElementById('flash').style.opacity = 0.5;
                    setTimeout(() => document.getElementById('flash').style.opacity = 0, 100);
                    scene.remove(eb); enemyBullets.splice(i,1);
                    if(player.hp <= 0) location.reload();
                }
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
