<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CYBER_FIGHTER.sh | 3D Alpha</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00f2ff; font-size: 24px; }
        .ui-panel { border: 1px solid rgba(0, 242, 255, 0.3); background: rgba(0, 242, 255, 0.05); backdrop-filter: blur(5px); }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="hud">
        <div class="crosshair">+</div>
        <div class="absolute top-10 left-10 ui-panel p-4 rounded">
            <div class="text-[10px] text-cyan-400 uppercase tracking-widest">System_Status</div>
            <div class="text-white font-bold text-lg">OPTIMAL</div>
            <div class="w-32 h-1 bg-slate-800 mt-2"><div class="h-full bg-cyan-400 w-full"></div></div>
        </div>
        <div class="absolute bottom-10 right-10 ui-panel p-6 rounded text-right">
            <div class="text-[10px] text-cyan-400 mb-1">PLASMA_CELL</div>
            <div class="text-3xl text-white font-bold">24 / 100</div>
            <div class="text-[10px] text-green-400 mt-1 animate-pulse">ALT_FIRE: [READY]</div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, gun;
        let bullets = [];
        let targets = [];
        let obstacles = [];
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        
        // Configuration des touches
        const keyMap = { 'KeyW': 'fwd', 'KeyS': 'bkwd', 'KeyA': 'left', 'KeyD': 'right', 
                         'ArrowUp': 'fwd', 'ArrowDown': 'bkwd', 'ArrowLeft': 'left', 'ArrowRight': 'right' };
        
        init();
        animate();
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617);
            scene.fog = new THREE.FogExp2(0x020617, 0.05);
        
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 5); 
        
            // Lumières
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);
            const sun = new THREE.DirectionalLight(0x00f2ff, 1);
            sun.position.set(10, 10, 10);
            scene.add(sun);
        
            // Sol
            const grid = new THREE.GridHelper(200, 50, 0x00f2ff, 0x050505);
            scene.add(grid);
        
            // L'ARME
            const gunGeo = new THREE.BoxGeometry(0.1, 0.15, 0.5);
            const gunMat = new THREE.MeshPhongMaterial({ color: 0x111111, emissive: 0x00f2ff });
            gun = new THREE.Mesh(gunGeo, gunMat);
            scene.add(gun);
        
            // CRÉATION D'OBJETS MOBILES (OBSTACLES)
            for(let i=0; i<15; i++) {
                const obsGeo = new THREE.BoxGeometry(2, 4, 2);
                const obsMat = new THREE.MeshPhongMaterial({ color: 0x001111, wireframe: false, emissive: 0x00f2ff, emissiveIntensity: 0.1 });
                const obs = new THREE.Mesh(obsGeo, obsMat);
                obs.position.set((Math.random()-0.5)*60, 2, (Math.random()-0.5)*60);
                obs.userData.speed = Math.random() * 0.05 + 0.02;
                scene.add(obs);
                obstacles.push(obs);
            }
        
            // ENNEMIS
            for(let i=0; i<8; i++) createTarget();
        
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
        
            // CONTRÔLES SOURIS (CORRIGÉ : Axe Y inversé supprimé)
            document.body.onclick = () => { document.body.requestPointerLock(); };
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    // ICI : On a changé le signe (+ au lieu de -) pour rétablir la direction naturelle
                    camera.rotation.x -= e.movementY * 0.002; 
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                }
            });
        
            // CONTRÔLES CLAVIER
            const onKey = (val) => (e) => { if(keyMap[e.code]) moveState[keyMap[e.code]] = val; };
            const moveState = { fwd: false, bkwd: false, left: false, right: false };
            document.addEventListener('keydown', (e) => { if(keyMap[e.code]) moveState[keyMap[e.code]] = true; });
            document.addEventListener('keyup', (e) => { if(keyMap[e.code]) moveState[keyMap[e.code]] = false; });
            window.moveState = moveState; // Rendre accessible pour animate
        
            window.onmousedown = () => { if(document.pointerLockElement) shoot(); };
        }
        
        function shoot() {
            const b = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({color: 0x00f2ff}));
            b.position.copy(camera.position);
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            b.userData.velocity = dir.multiplyScalar(1.2);
            scene.add(b);
            bullets.push(b);
        }
        
        function createTarget() {
            const t = new THREE.Mesh(new THREE.OctahedronGeometry(0.6), new THREE.MeshPhongMaterial({color: 0xff0055, wireframe: true}));
            t.position.set((Math.random()-0.5)*50, 1.5, (Math.random()-0.5)*50);
            scene.add(t);
            targets.push(t);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            const state = window.moveState;
        
            // LOGIQUE DE DÉPLACEMENT
            direction.z = Number(state.fwd) - Number(state.bkwd);
            direction.x = Number(state.right) - Number(state.left);
            direction.normalize();
        
            if (state.fwd || state.bkwd) velocity.z -= direction.z * 0.02;
            if (state.left || state.right) velocity.x -= direction.x * 0.02;
        
            camera.translateX(-velocity.x);
            camera.translateZ(-velocity.z);
            velocity.multiplyScalar(0.9); // Friction (ralentissement)
        
            // ANIMATION DES OBSTACLES
            obstacles.forEach(obs => {
                obs.position.z += obs.userData.speed;
                if(obs.position.z > 40) obs.position.z = -40; // Loop
                obs.rotation.y += 0.01;
            });
        
            // Arme
            gun.position.copy(camera.position);
            gun.quaternion.copy(camera.quaternion);
            gun.translateX(0.3); gun.translateY(-0.2); gun.translateZ(-0.5);
        
            // Bullets & Collisions
            bullets.forEach((b, i) => {
                b.position.add(b.userData.velocity);
                targets.forEach((t, ti) => {
                    if(b.position.distanceTo(t.position) < 1) {
                        scene.remove(t); targets.splice(ti, 1); createTarget();
                    }
                });
            });
        
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
