<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CYBER_CITY_SURVIVOR | Baptiste Duval</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 25px; z-index: 10; }
        .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 22px; height: 22px; border: 2px solid #00f2ff; border-radius: 50%; }
        .bar-container { height: 12px; background: rgba(0,0,0,0.6); border: 1px solid #444; width: 280px; border-radius: 6px; overflow: hidden; margin-bottom: 5px; }
        #hp-fill { height: 100%; background: #22c55e; width: 100%; transition: 0.3s; }
        #sh-fill { height: 100%; background: #3b82f6; width: 100%; transition: 0.3s; }
        .slot { width: 75px; height: 75px; border: 2px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; font-size: 10px; border-radius: 12px; flex-direction: column; color: #666; }
        .active { border-color: #00f2ff; background: rgba(0,242,255,0.15); color: #fff; box-shadow: 0 0 15px #00f2ff; }
        #flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: red; opacity: 0; pointer-events: none; z-index: 100; transition: 0.1s; }
        #loot-msg { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); color: #00f2ff; font-weight: bold; opacity: 0; transition: 0.5s; font-size: 20px; }
    </style>
</head>
<body>
    <div id="flash"></div>
    <div id="loot-msg">LOOT RÉCUPÉRÉ ! +MUNITIONS</div>
    <div id="hud">
        <div class="flex justify-between items-start">
            <div>
                <div class="bar-container"><div id="hp-fill"></div></div>
                <div class="bar-container"><div id="sh-fill"></div></div>
                <div class="text-[10px] text-white">SYSTEM_HEALTH: <span id="hp-val">100</span> | SHIELD: <span id="sh-val">100</span></div>
            </div>
            <div id="kill-counter" class="text-white font-bold tracking-widest text-xl">KILLS: 0</div>
            <div class="text-right">
                <div id="weapon-name" class="text-cyan-400 text-xs font-bold uppercase tracking-widest">Rifle</div>
                <div id="ammo-display" class="text-white text-3xl font-bold">30 / 180</div>
            </div>
        </div>

        <div class="flex gap-4 justify-center mb-10">
            <div id="s1" class="slot">1<br>PISTOL</div>
            <div id="s2" class="slot active">2<br>RIFLE</div>
            <div id="s3" class="slot">3<br>SHOTGUN</div>
            <div id="s4" class="slot">4<br>SNIPER</div>
            <div id="s5" class="slot text-cyan-400">5<br>BUILD</div>
        </div>
    </div>
    <div class="crosshair"></div>

    <script>
        let scene, camera, renderer, gun;
        let bullets = [], zombies = [], walls = [], buildings = [], chests = [];
        let player = { hp: 100, sh: 100, mode: 'weapon', weapon: 'rifle', kills: 0 };
        let moveState = { fwd: false, bkwd: false, left: false, right: false };
        let isReloading = false, lastShootTime = 0;

        const WEAPONS = {
            pistol: { name: "Pistol", rate: 250, ammo: 12, mag: 12, res: 72, recoil: 0.02, spread: 0.01, geo: [0.1, 0.18, 0.4] },
            rifle: { name: "Rifle", rate: 100, ammo: 30, mag: 30, res: 180, recoil: 0.03, spread: 0.03, geo: [0.12, 0.22, 0.8] },
            shotgun: { name: "Shotgun", rate: 850, ammo: 6, mag: 6, res: 30, recoil: 0.12, spread: 0.12, pellets: 8, geo: [0.22, 0.25, 0.6] },
            sniper: { name: "Sniper", rate: 1600, ammo: 5, mag: 5, res: 20, recoil: 0.25, spread: 0.001, geo: [0.1, 0.2, 1.6] }
        };

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x010305);
            scene.fog = new THREE.FogExp2(0x010305, 0.045);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.7, 25);
            camera.rotation.order = 'YXZ';

            scene.add(new THREE.AmbientLight(0xffffff, 0.2));
            const cityLight = new THREE.PointLight(0x00f2ff, 1, 100);
            scene.add(cityLight);

            // SOL URBAIN
            const grid = new THREE.GridHelper(400, 100, 0x00f2ff, 0x050505);
            scene.add(grid);

            // GÉNÉRATION DE LA VILLE
            for(let i=0; i<60; i++) {
                const height = 15 + Math.random() * 40;
                const bGeo = new THREE.BoxGeometry(10, height, 10);
                const bMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.8 });
                const b = new THREE.Mesh(bGeo, bMat);
                
                // Positionnement aléatoire en évitant le centre
                let rx, rz;
                do { rx = (Math.random()-0.5)*200; rz = (Math.random()-0.5)*200; }
                while(Math.abs(rx) < 15 && Math.abs(rz) < 15);
                
                b.position.set(rx, height/2, rz);
                scene.add(b);
                buildings.push(b);
            }

            // COFFRES INITIAL
            for(let i=0; i<8; i++) spawnChest();

            // ZOMBIES
            for(let i=0; i<15; i++) spawnZombie();

            updateWeaponMesh();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // CONTROLES
            document.body.onclick = () => document.body.requestPointerLock();
            document.addEventListener('mousemove', (e) => {
                if(document.pointerLockElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                }
            });

            const onKey = (val) => (e) => {
                if(e.code === 'KeyW' || e.code === 'KeyZ') moveState.fwd = val;
                if(e.code === 'KeyS') moveState.bkwd = val;
                if(e.code === 'KeyA' || e.code === 'KeyQ') moveState.left = val;
                if(e.code === 'KeyD') moveState.right = val;
                if(val && e.code === 'KeyR') reload();
                if(val && e.code.startsWith('Digit')) switchSlot(e.code.replace('Digit',''));
            };
            document.addEventListener('keydown', onKey(true));
            document.addEventListener('keyup', onKey(false));
            window.onmousedown = () => { if(document.pointerLockElement) (player.mode === 'weapon' ? shoot() : build()); };
        }

        function updateWeaponMesh() {
            if(gun) scene.remove(gun);
            const w = WEAPONS[player.weapon];
            gun = new THREE.Mesh(new THREE.BoxGeometry(...w.geo), new THREE.MeshStandardMaterial({color: 0x111111, emissive: 0x00f2ff, emissiveIntensity: 0.4}));
            scene.add(gun);
        }

        function switchSlot(n) {
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
            if(!document.getElementById('s'+n)) return;
            document.getElementById('s'+n).classList.add('active');
            if(n == 5) { player.mode = 'build'; gun.visible = false; } 
            else {
                player.mode = 'weapon'; gun.visible = true;
                player.weapon = ['pistol','rifle','shotgun','sniper'][n-1];
                updateWeaponMesh(); updateHUD();
            }
        }

        function spawnZombie() {
            const z = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.8), new THREE.MeshStandardMaterial({color: 0x1a4a1a}));
            const eyes = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.1), new THREE.MeshBasicMaterial({color: 0xff0000}));
            eyes.position.set(0, 0.6, 0.4);
            z.add(body, eyes);
            z.position.set((Math.random()-0.5)*180, 0.9, (Math.random()-0.5)*180);
            scene.add(z);
            zombies.push(z);
        }

        function spawnChest() {
            const c = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({color: 0xffcc00, emissive: 0xffaa00, emissiveIntensity: 0.5}));
            c.position.set((Math.random()-0.5)*180, 0.6, (Math.random()-0.5)*180);
            scene.add(c);
            chests.push(c);
        }

        function reload() {
            const w = WEAPONS[player.weapon];
            if(isReloading || w.ammo === w.mag || w.res === 0) return;
            isReloading = true;
            gun.rotation.x = -Math.PI/3;
            setTimeout(() => {
                const t = Math.min(w.mag - w.ammo, w.res);
                w.ammo += t; w.res -= t;
                gun.rotation.x = 0; isReloading = false; updateHUD();
            }, 1200);
        }

        function shoot() {
            const w = WEAPONS[player.weapon];
            const now = Date.now();
            if(isReloading || now - lastShootTime < w.rate) return;
            if(w.ammo <= 0) { reload(); return; }
            w.ammo--; lastShootTime = now;

            const fire = () => {
                const b = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({color: 0x00f2ff}));
                b.position.copy(camera.position);
                const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
                dir.x += (Math.random()-0.5)*w.spread; dir.y += (Math.random()-0.5)*w.spread;
                b.userData.vel = dir.normalize().multiplyScalar(2.8);
                scene.add(b); bullets.push(b);
            };
            if(w.pellets) { for(let i=0; i<w.pellets; i++) fire(); } else fire();
            camera.rotation.x += w.recoil;
            updateHUD();
        }

        function build() {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(4.5, 3.5, 0.4), new THREE.MeshStandardMaterial({color: 0x00f2ff, transparent: true, opacity: 0.5}));
            const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
            wall.position.copy(camera.position).addScaledVector(dir, 5);
            wall.position.y = 1.75; wall.rotation.y = camera.rotation.y;
            scene.add(wall); walls.push(wall);
        }

        function updateHUD() {
            const w = WEAPONS[player.weapon];
            document.getElementById('weapon-name').innerText = w.name;
            document.getElementById('ammo-display').innerText = `${w.ammo} / ${w.res}`;
            document.getElementById('hp-val').innerText = Math.ceil(player.hp);
            document.getElementById('sh-val').innerText = Math.ceil(player.sh);
            document.getElementById('hp-fill').style.width = player.hp + '%';
            document.getElementById('sh-fill').style.width = player.sh + '%';
            document.getElementById('kill-counter').innerText = `KILLS: ${player.kills}`;
        }

        function checkCollision(obj, targetList, radius) {
            for(let target of targetList) {
                if(obj.position.distanceTo(target.position) < radius) return true;
            }
            return false;
        }

        function animate() {
            requestAnimationFrame(animate);
            const speed = 0.18; const move = new THREE.Vector3();
            if(moveState.fwd) move.z -= 1; if(moveState.bkwd) move.z += 1;
            if(moveState.left) move.x -= 1; if(moveState.right) move.x += 1;
            move.applyQuaternion(camera.quaternion); move.y = 0;
            const nextPos = camera.position.clone().addScaledVector(move.normalize(), speed);

            // COLLISION JOUEUR -> BÂTIMENTS & MURS
            let canMove = true;
            buildings.forEach(b => { if(nextPos.distanceTo(b.position) < 6) canMove = false; });
            walls.forEach(w => { if(nextPos.distanceTo(w.position) < 2.5) canMove = false; });
            if(canMove) camera.position.copy(nextPos);

            // ARME
            if(player.mode === 'weapon') {
                gun.position.copy(camera.position); gun.quaternion.copy(camera.quaternion);
                gun.translateX(0.38); gun.translateY(-0.28); gun.translateZ(-0.75);
            }

            // BALLES (Collision avec murs et bâtiments fixée)
            bullets.forEach((b, i) => {
                b.position.add(b.userData.vel);
                let hit = false;
                zombies.forEach((z, zi) => {
                    if(b.position.distanceTo(z.position) < 1.4) {
                        scene.remove(z); zombies.splice(zi,1); spawnZombie();
                        hit = true; player.kills++; updateHUD();
                    }
                });
                buildings.forEach(build => { if(b.position.distanceTo(build.position) < 5.2) hit = true; });
                walls.forEach(w => { if(b.position.distanceTo(w.position) < 1.8) hit = true; });

                if(hit || b.position.distanceTo(camera.position) > 150) { scene.remove(b); bullets.splice(i,1); }
            });

            // ZOMBIES IA (Avec évitement de murs)
            zombies.forEach(z => {
                const toPlayer = new THREE.Vector3().subVectors(camera.position, z.position).normalize();
                const nextZPos = z.position.clone().addScaledVector(toPlayer, 0.06);
                
                // Le zombie ne traverse pas les bâtiments
                let zBlocked = false;
                buildings.forEach(b => { if(nextZPos.distanceTo(b.position) < 5.5) zBlocked = true; });
                walls.forEach(w => { if(nextZPos.distanceTo(w.position) < 2.2) zBlocked = true; });
                
                if(!zBlocked) z.position.copy(nextZPos);
                z.lookAt(camera.position.x, 0.9, camera.position.z);

                if(z.position.distanceTo(camera.position) < 1.6) {
                    player.sh -= 0.4; if(player.sh < 0) { player.hp -= 0.4; player.sh = 0; }
                    document.getElementById('flash').style.opacity = 0.4; setTimeout(() => document.getElementById('flash').style.opacity = 0, 50);
                    updateHUD(); if(player.hp <= 0) location.reload();
                }
            });

            // COFFRES
            chests.forEach((c, i) => {
                c.rotation.y += 0.04;
                if(camera.position.distanceTo(c.position) < 2.2) {
                    WEAPONS.rifle.res += 60; WEAPONS.shotgun.res += 10; player.sh = Math.min(100, player.sh + 30);
                    scene.remove(c); chests.splice(i,1); spawnChest();
                    document.getElementById('loot-msg').style.opacity = 1; setTimeout(() => document.getElementById('loot-msg').style.opacity = 0, 1500);
                    updateHUD();
                }
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
