<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification | Baptiste Duval</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Fira+Code:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fira Code', monospace; background-color: #020617; color: #e2e8f0; }
        .glass-box { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(0, 242, 255, 0.2); }
        input { background: rgba(255, 255, 255, 0.05) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; color: white !important; }
        input:focus { border-color: #00f2ff !important; outline: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="glass-box w-full max-w-md p-8 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
            <h2 class="text-cyan-400 font-['Orbitron'] text-xl font-bold tracking-widest uppercase">Protocol_Login</h2>
            <p class="text-slate-500 text-[10px] mt-2 italic">Accès restreint à l'administrateur</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label class="text-[10px] uppercase tracking-wider text-slate-400">Identifiant (Email)</label>
                <input type="email" id="email" required class="w-full mt-1 p-3 rounded-lg text-sm">
            </div>
            <div>
                <label class="text-[10px] uppercase tracking-wider text-slate-400">Clé d'accès (Password)</label>
                <input type="password" id="password" required class="w-full mt-1 p-3 rounded-lg text-sm">
            </div>
            <button type="submit" id="btn-submit" class="w-full py-3 bg-cyan-500/10 border border-cyan-500 text-cyan-400 font-bold uppercase text-xs tracking-widest hover:bg-cyan-500 hover:text-black transition">
                Exécuter l'authentification
            </button>
        </form>

        <div id="message" class="mt-4 text-center text-xs hidden"></div>
    </div>

    <script>
        // Configuration Supabase
        const SUPABASE_URL = "https://xtdurfmmkuyrbpignxnm.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0ZHVyZm1ta3V5cmJwaWdueG5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyODM1MjYsImV4cCI6MjA4NTg1OTUyNn0.N3cX1vc3MOoitSUyQ__P4p_ZcLN4porG94DN38Vejmc";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const loginForm = document.getElementById('login-form');
        const msg = document.getElementById('message');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            msg.classList.remove('hidden');
            msg.innerText = "Vérification des signatures...";
            msg.className = "mt-4 text-center text-xs text-cyan-400";

            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                msg.innerText = "ERREUR : " + error.message;
                msg.className = "mt-4 text-center text-xs text-red-500 font-bold";
            } else {
                msg.innerText = "ACCÈS AUTORISÉ. Redirection...";
                msg.className = "mt-4 text-center text-xs text-green-500 font-bold";
                // Redirige vers ta page secrète après 1.5s
                setTimeout(() => {
                    window.location.href = "ma-page-perso.html";
                }, 1500);
            }
        });
    </script>
</body>
</html>
