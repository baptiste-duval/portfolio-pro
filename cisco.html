<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>JS-PacketTracer Alpha</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #1e1e1e; color: white; display: flex; flex-direction: column; height: 100vh; }
        #toolbar { height: 50px; background: #333; display: flex; align-items: center; padding: 0 20px; gap: 10px; }
        #main { display: flex; flex: 1; }
        canvas { background: #252526; flex: 1; cursor: crosshair; }
        
        /* Terminal / Console */
        #console-container { width: 400px; background: #000; display: none; flex-direction: column; border-left: 2px solid #444; }
        #terminal { flex: 1; padding: 10px; font-family: 'Courier New', monospace; color: #0f0; overflow-y: auto; font-size: 13px; white-space: pre-wrap; }
        #input-line { display: flex; background: #111; padding: 5px; }
        #input-line span { color: #0f0; margin-right: 5px; }
        #cli-input { background: transparent; border: none; color: white; outline: none; flex: 1; font-family: inherit; }

        .btn { padding: 5px 12px; cursor: pointer; background: #007acc; border: none; color: white; border-radius: 3px; }
        .active { background: #cc7a00; }
    </style>
</head>
<body>

<div id="toolbar">
    <button class="btn" id="btn-pc" onclick="setMode('node-pc')">+ Ajouter PC</button>
    <button class="btn" id="btn-rt" onclick="setMode('node-rt')">+ Ajouter Routeur</button>
    <button class="btn" id="btn-link" onclick="setMode('link')">Câble</button>
    <div id="status" style="margin-left: 20px; font-size: 12px; color: #aaa;">Mode : Sélection</div>
</div>

<div id="main">
    <canvas id="netCanvas"></canvas>
    
    <div id="console-container" id="consoleContainer">
        <div style="padding: 5px; background: #333; font-size: 12px; text-align: center;" id="cli-title">Console</div>
        <div id="terminal"></div>
        <div id="input-line">
            <span id="prompt">></span>
            <input type="text" id="cli-input" autocomplete="off">
        </div>
        <button class="btn" style="background: #c0392b; border-radius: 0;" onclick="closeConsole()">Fermer X</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('netCanvas');
    const ctx = canvas.getContext('2d');
    const terminal = document.getElementById('terminal');
    const cliInput = document.getElementById('cli-input');
    
    canvas.width = window.innerWidth - 0;
    canvas.height = window.innerHeight - 50;

    let nodes = [];
    let links = [];
    let mode = 'select';
    let activeNode = null;
    let linkStart = null;

    class Device {
        constructor(x, y, type, name) {
            this.x = x; this.y = y;
            this.type = type; // 'pc' ou 'router'
            this.name = name;
            this.ip = "0.0.0.0";
            this.isDhcpEnabled = false;
            this.dhcpServer = false; // Uniquement pour routeur
            this.pool = []; // IPs à distribuer
            this.radius = type === 'pc' ? 20 : 30;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.type === 'pc' ? "#3498db" : "#e67e22";
            if (activeNode === this) ctx.strokeStyle = "white"; else ctx.strokeStyle = "transparent";
            ctx.lineWidth = 3; ctx.stroke(); ctx.fill();
            ctx.fillStyle = "white"; ctx.textAlign = "center";
            ctx.fillText(this.name, this.x, this.y + this.radius + 15);
            ctx.font = "10px Arial";
            ctx.fillText(this.ip, this.x, this.y + this.radius + 28);
        }
    }

    function setMode(m) { 
        mode = m; 
        document.getElementById('status').innerText = "Mode : " + m;
        linkStart = null;
    }

    canvas.addEventListener('mousedown', (e) => {
        const x = e.clientX; const y = e.clientY - 50;
        const clicked = nodes.find(n => Math.hypot(n.x - x, n.y - y) < n.radius);

        if (mode.startsWith('node') && !clicked) {
            const type = mode.split('-')[1];
            nodes.push(new Device(x, y, type, (type === 'pc' ? "PC-" : "RT-") + nodes.length));
        } else if (clicked) {
            if (mode === 'link') {
                if (!linkStart) linkStart = clicked;
                else if (linkStart !== clicked) {
                    links.push({ a: linkStart, b: clicked });
                    linkStart = null;
                }
            } else {
                openConsole(clicked);
            }
        }
        render();
    });

    function openConsole(node) {
        activeNode = node;
        document.getElementById('console-container').style.display = 'flex';
        document.getElementById('cli-title').innerText = "Configuration : " + node.name;
        terminal.innerText = `--- Bienvenue sur ${node.name} (${node.type.toUpperCase()}) ---\nTapez 'help' pour les commandes.`;
        document.getElementById('prompt').innerText = node.name + ">";
        canvas.width = window.innerWidth - 400;
        render();
    }

    function closeConsole() {
        document.getElementById('console-container').style.display = 'none';
        activeNode = null;
        canvas.width = window.innerWidth;
        render();
    }

    // --- LOGIQUE DU TERMINAL (CLI) ---
    cliInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const cmd = cliInput.value.toLowerCase().trim();
            processCommand(cmd);
            cliInput.value = "";
        }
    });

    function processCommand(cmd) {
        terminal.innerText += `\n${activeNode.name}> ${cmd}`;
        const args = cmd.split(' ');

        if (cmd === 'help') {
            terminal.innerText += `\nCommandes: ip [adresse], ping [ip], dhcp-on, dhcp-server (rt only)`;
        } 
        else if (args[0] === 'ip') {
            activeNode.ip = args[1];
            terminal.innerText += `\nInterface configurée avec l'IP ${args[1]}`;
        }
        else if (cmd === 'dhcp-on' && activeNode.type === 'pc') {
            // Chercher un routeur relié qui est serveur DHCP
            const router = links.find(l => {
                const target = (l.a === activeNode ? l.b : (l.b === activeNode ? l.a : null));
                return target && target.type === 'router' && target.dhcpServer;
            });
            if (router) {
                activeNode.ip = "192.168.1." + (Math.floor(Math.random()*250));
                terminal.innerText += `\nDHCP Succès ! Nouvelle IP: ${activeNode.ip}`;
            } else {
                terminal.innerText += `\nErreur: Aucun serveur DHCP trouvé sur le lien.`;
            }
        }
        else if (cmd === 'dhcp-server' && activeNode.type === 'router') {
            activeNode.dhcpServer = true;
            terminal.innerText += `\nMode serveur DHCP activé sur ce routeur.`;
        }
        else if (args[0] === 'ping') {
            const targetIp = args[1];
            const targetNode = nodes.find(n => n.ip === targetIp);
            if (targetNode) terminal.innerText += `\nRéponse de ${targetIp}: 32 octets en 1ms...`;
            else terminal.innerText += `\nDélai d'attente dépassé (Destination injoignable).`;
        }

        terminal.scrollTop = terminal.scrollHeight;
        render();
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        links.forEach(l => {
            ctx.beginPath(); ctx.moveTo(l.a.x, l.a.y); ctx.lineTo(l.b.x, l.b.y);
            ctx.strokeStyle = "#555"; ctx.lineWidth = 2; ctx.stroke();
        });
        nodes.forEach(n => n.draw());
    }

    render();
</script>
</body>
</html>
