<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Baptiste Duval</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Fira+Code:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fira Code', monospace; background-color: #020617; color: #e2e8f0; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); transition: all 0.3s ease; overflow: hidden; height: 100%; }
        .glass-card:hover { border-color: #00f2ff; transform: translateY(-4px); box-shadow: 0 20px 40px -20px rgba(0, 242, 255, 0.4); }
        .admin-input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; font-size: 12px; color: white; outline: none; width: 100%; }
        .admin-input:focus { border-color: #00f2ff; }
        .filter-btn { font-size: 9px; font-weight: bold; padding: 6px 12px; border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 4px; color: #94a3b8; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
        .active-filter { background: rgba(0, 242, 255, 0.1); border-color: #00f2ff; color: #00f2ff; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <nav class="border-b border-white/10 px-8 py-4 flex justify-between items-center bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <h1 class="font-['Orbitron'] text-xs font-bold tracking-widest text-cyan-400">ADMIN_LINK_MANAGER.v3</h1>
        <button onclick="logout()" class="text-[9px] font-bold text-red-500 uppercase border border-red-500/30 px-3 py-1 rounded hover:bg-red-500 hover:text-white transition">Logout</button>
    </nav>

    <main class="max-w-6xl mx-auto p-8">
        <section class="mb-10 p-6 border border-cyan-500/20 bg-cyan-500/5 rounded-2xl">
            <h2 class="text-[10px] font-bold text-cyan-400 uppercase mb-4 tracking-widest">Initialiser une nouvelle entrée</h2>
            <form id="add-link-form" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                <input type="text" id="label" placeholder="Nom du produit" required class="admin-input">
                <input type="url" id="url" placeholder="Lien (URL)" required class="admin-input">
                <input type="text" id="category" placeholder="Catégorie" required class="admin-input">
                <input type="text" id="image_url" placeholder="Lien de l'image (URL)" class="admin-input">
                <button type="submit" id="submit-btn" class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold py-2 rounded-lg text-[10px] uppercase transition">Ajouter</button>
            </form>
        </section>

        <div id="filter-bar" class="flex flex-wrap gap-2 mb-8">
            <button onclick="filterLinks('ALL')" id="btn-ALL" class="filter-btn active-filter">Chargement...</button>
        </div>

        <div id="links-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <script>
        const SUPABASE_URL = "https://xtdurfmmkuyrbpignxnm.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0ZHVyZm1ta3V5cmJwaWdueG5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyODM1MjYsImV4cCI6MjA4NTg1OTUyNn0.N3cX1vc3MOoitSUyQ__P4p_ZcLN4porG94DN38Vejmc";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allLinks = [];

        async function fetchLinks() {
            const { data, error } = await _supabase.from('links').select('*').order('created_at', { ascending: false });
            if (!error) {
                allLinks = data;
                updateUI();
            }
        }

        function updateUI() {
            const filterBar = document.getElementById('filter-bar');
            const cats = [...new Set(allLinks.map(l => l.category))];
            filterBar.innerHTML = `<button onclick="filterLinks('ALL')" id="btn-ALL" class="filter-btn active-filter">TOUT (${allLinks.length})</button>`;
            cats.forEach(c => {
                const count = allLinks.filter(l => l.category === c).length;
                filterBar.innerHTML += `<button onclick="filterLinks('${c}')" id="btn-${c}" class="filter-btn">${c} (${count})</button>`;
            });
            renderLinks(allLinks);
        }

        function renderLinks(list) {
            const container = document.getElementById('links-container');
            container.innerHTML = list.map(link => `
                <div class="glass-card flex flex-col">
                    <div class="h-48 w-full bg-slate-900/50 relative">
                        <img src="${link.image_url || 'https://via.placeholder.com/400x300?text=No+Image'}" 
                             class="w-full h-full object-cover opacity-70 group-hover:opacity-100 transition duration-500"
                             onerror="this.src='https://via.placeholder.com/400x300?text=URL+Image+Invalide'">
                    </div>
                    <div class="p-5 flex-grow flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-[8px] font-bold text-cyan-400 border border-cyan-400/30 px-2 py-0.5 rounded uppercase">${link.category}</span>
                                <button onclick="deleteLink(${link.id})" class="text-slate-600 hover:text-red-500 transition"><i class="fas fa-trash-alt"></i></button>
                            </div>
                            <h3 class="text-white font-bold text-md mb-4">${link.label}</h3>
                        </div>
                        <a href="${link.url}" target="_blank" class="block w-full py-2 bg-cyan-500/10 border border-cyan-500/30 text-center text-[9px] font-bold uppercase tracking-widest text-cyan-400 hover:bg-cyan-500 hover:text-black transition rounded">Voir le produit</a>
                    </div>
                </div>
            `).join('');
        }

        const form = document.getElementById('add-link-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;

            const { error } = await _supabase.from('links').insert([{
                label: document.getElementById('label').value,
                url: document.getElementById('url').value,
                category: document.getElementById('category').value.toUpperCase(),
                image_url: document.getElementById('image_url').value
            }]);

            if (!error) {
                form.reset();
                fetchLinks();
            }
            btn.disabled = false;
        });

        async function deleteLink(id) {
            if(confirm("Supprimer définitivement cet item ?")) {
                await _supabase.from('links').delete().eq('id', id);
                fetchLinks();
            }
        }

        function filterLinks(cat) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-filter'));
            document.getElementById(`btn-${cat}`).classList.add('active-filter');
            renderLinks(cat === 'ALL' ? allLinks : allLinks.filter(l => l.category === cat));
        }

        async function logout() { await _supabase.auth.signOut(); window.location.href = "prive.html"; }
        
        window.onload = async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) window.location.href = "prive.html";
            else fetchLinks();
        };
    </script>
</body>
</html>
