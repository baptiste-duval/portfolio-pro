<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Privé | Baptiste Duval</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Fira+Code:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fira Code', monospace; background-color: #020617; color: #e2e8f0; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); transition: all 0.3s ease; }
        .glass-card:hover { border-color: #00f2ff; transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(0, 242, 255, 0.3); }
        .admin-input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 6px; font-size: 12px; color: white; outline: none; }
        .admin-input:focus { border-color: #00f2ff; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="border-b border-white/10 px-8 py-4 flex justify-between items-center bg-slate-900/50">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-cyan-500/20 border border-cyan-500 flex items-center justify-center rounded">
                <i class="fas fa-shield-halved text-cyan-400 text-sm"></i>
            </div>
            <h1 class="font-['Orbitron'] text-sm font-bold tracking-tighter uppercase">Root_Terminal.sys</h1>
        </div>
        <div class="flex items-center gap-6">
            <button onclick="logout()" class="text-[10px] uppercase font-bold text-red-500 hover:text-red-400 transition">
                <i class="fas fa-power-off mr-2"></i> Déconnexion
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-8">
        
        <section class="mb-12 p-6 border border-cyan-500/20 bg-cyan-500/5 rounded-2xl">
            <h2 class="text-xs font-bold text-cyan-400 uppercase tracking-widest mb-4 flex items-center">
                <i class="fas fa-plus-circle mr-2"></i> Ajouter une nouvelle cible
            </h2>
            <form id="add-link-form" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="label" placeholder="Nom (ex: Proxmox)" required class="admin-input">
                <input type="url" id="url" placeholder="URL (https://...)" required class="admin-input">
                <input type="text" id="category" placeholder="Catégorie (ex: INFRA)" class="admin-input">
                <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold py-2 rounded text-xs uppercase transition">
                    Injecter le lien
                </button>
            </form>
        </section>

        <header class="mb-8 flex justify-between items-end">
            <div>
                <h2 class="text-2xl font-bold font-['Orbitron'] text-white">Index_Réseau</h2>
                <p class="text-slate-500 text-[10px] italic uppercase tracking-[0.3em]">Liste des accès autorisés</p>
            </div>
            <span id="status-tag" class="text-[9px] bg-green-500/10 text-green-500 border border-green-500/20 px-3 py-1 rounded uppercase font-bold tracking-tighter">Système Connecté</span>
        </header>

        <div id="links-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="text-cyan-400 animate-pulse text-xs uppercase tracking-widest p-10">Scan du réseau en cours...</div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://xtdurfmmkuyrbpignxnm.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0ZHVyZm1ta3V5cmJwaWdueG5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyODM1MjYsImV4cCI6MjA4NTg1OTUyNn0.N3cX1vc3MOoitSUyQ__P4p_ZcLN4porG94DN38Vejmc";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. Vérification de la session
        async function init() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                window.location.href = "prive.html";
            } else {
                fetchLinks();
            }
        }

        // 2. Récupérer les liens
        async function fetchLinks() {
            const { data: links, error } = await _supabase
                .from('links')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                return;
            }
            renderLinks(links);
        }

        // 3. Afficher les liens
        function renderLinks(links) {
            const container = document.getElementById('links-container');
            container.innerHTML = '';

            if (links.length === 0) {
                container.innerHTML = '<p class="text-slate-500 italic text-sm p-10">Aucune donnée trouvée.</p>';
                return;
            }

            links.forEach(link => {
                container.innerHTML += `
                    <div class="glass-card p-6 rounded-xl group flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-[8px] font-bold text-cyan-400 border border-cyan-500/30 px-2 py-0.5 rounded uppercase">${link.category || 'EXT'}</span>
                                <button onclick="deleteLink(${link.id})" class="text-slate-600 hover:text-red-500 text-[10px] transition"><i class="fas fa-trash"></i></button>
                            </div>
                            <a href="${link.url}" target="_blank" class="block">
                                <h3 class="text-white font-bold text-lg group-hover:text-cyan-400 transition-colors">${link.label}</h3>
                            </a>
                        </div>
                        <div class="mt-4 flex items-center justify-between">
                            <span class="text-[10px] text-slate-500 font-mono truncate max-w-[80%]">${link.url}</span>
                            <a href="${link.url}" target="_blank" class="text-slate-500 hover:text-cyan-400"><i class="fas fa-external-link-alt"></i></a>
                        </div>
                    </div>
                `;
            });
        }

        // 4. Ajouter un lien
        const form = document.getElementById('add-link-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newLink = {
                label: document.getElementById('label').value,
                url: document.getElementById('url').value,
                category: document.getElementById('category').value.toUpperCase() || 'INFRA'
            };

            const { error } = await _supabase
                .from('links')
                .insert([newLink]);

            if (error) {
                alert("Erreur d'injection : " + error.message);
            } else {
                form.reset();
                fetchLinks(); // Rafraîchir la liste
            }
        });

        // 5. Supprimer un lien (Optionnel mais utile)
        async function deleteLink(id) {
            if(confirm("Confirmer la suppression du point d'accès ?")) {
                const { error } = await _supabase.from('links').delete().eq('id', id);
                if (!error) fetchLinks();
            }
        }

        // Déconnexion
        async function logout() {
            await _supabase.auth.signOut();
            window.location.href = "prive.html";
        }

        window.onload = init;
    </script>
</body>
</html>
