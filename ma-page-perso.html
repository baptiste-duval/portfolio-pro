<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Baptiste Duval</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Fira+Code:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fira Code', monospace; background-color: #020617; color: #e2e8f0; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); transition: all 0.3s ease; }
        .glass-card:hover { border-color: #00f2ff; transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(0, 242, 255, 0.3); }
        
        .admin-input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); padding: 10px 14px; border-radius: 8px; font-size: 13px; color: white; outline: none; width: 100%; }
        .admin-input:focus { border-color: #00f2ff; box-shadow: 0 0 10px rgba(0, 242, 255, 0.1); }

        .filter-btn { font-size: 10px; font-weight: bold; letter-spacing: 0.1em; padding: 8px 16px; border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 6px; color: #94a3b8; transition: all 0.2s; text-transform: uppercase; cursor: pointer; }
        .filter-btn:hover { border-color: #00f2ff; color: #00f2ff; }
        .active-filter { background: rgba(0, 242, 255, 0.1); border-color: #00f2ff; color: #00f2ff; }
        
        .category-badge { font-size: 8px; background: rgba(0, 242, 255, 0.1); color: #00f2ff; padding: 2px 6px; border-radius: 4px; margin-left: 6px; border: 1px solid rgba(0, 242, 255, 0.2); }
    </style>
</head>
<body class="min-h-screen pb-20">

    <nav class="border-b border-white/10 px-8 py-4 flex justify-between items-center bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-cyan-500/20 border border-cyan-500 flex items-center justify-center rounded shadow-[0_0_15px_rgba(0,242,255,0.2)]">
                <i class="fas fa-user-shield text-cyan-400"></i>
            </div>
            <div>
                <h1 class="font-['Orbitron'] text-sm font-bold tracking-widest uppercase text-white">Admin_Panel.sys</h1>
                <p class="text-[8px] text-green-500 font-bold uppercase animate-pulse">Session Active</p>
            </div>
        </div>
        <button onclick="logout()" class="text-[10px] px-4 py-2 border border-red-500/30 text-red-500 uppercase font-bold hover:bg-red-500 hover:text-white transition rounded-md">
            <i class="fas fa-sign-out-alt mr-2"></i> Terminer la session
        </button>
    </nav>

    <main class="max-w-6xl mx-auto p-8">
        
        <section class="mb-12 p-6 border border-cyan-500/20 bg-cyan-500/5 rounded-2xl">
            <h2 class="text-[10px] font-bold text-cyan-400 uppercase tracking-[0.3em] mb-6 flex items-center">
                <i class="fas fa-plus-circle mr-2"></i> Initialiser une nouvelle entrée
            </h2>
            <form id="add-link-form" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="label" placeholder="Nom (ex: Proxmox)" required class="admin-input">
                <input type="url" id="url" placeholder="URL (https://...)" required class="admin-input">
                <input type="text" id="category" placeholder="Catégorie (ex: INFRA)" required class="admin-input">
                <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold py-2 rounded-lg text-[10px] uppercase tracking-widest transition shadow-lg shadow-cyan-500/20">
                    Injecter dans la BDD
                </button>
            </form>
        </section>

        <div class="mb-6">
            <p class="text-[10px] text-slate-500 uppercase tracking-widest mb-4 font-bold">Filtrer par segment :</p>
            <div id="filter-bar" class="flex flex-wrap gap-3">
                <button onclick="filterLinks('ALL')" id="btn-ALL" class="filter-btn active-filter">TOUT</button>
            </div>
        </div>

        <hr class="border-white/5 mb-10">

        <div id="links-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-20 text-center">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-cyan-500 mb-4"></div>
                <p class="text-cyan-400 text-xs uppercase tracking-widest">Séquence de boot en cours...</p>
            </div>
        </div>
    </main>

    <script>
        // CONFIGURATION SUPABASE
        const SUPABASE_URL = "https://xtdurfmmkuyrbpignxnm.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0ZHVyZm1ta3V5cmJwaWdueG5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyODM1MjYsImV4cCI6MjA4NTg1OTUyNn0.N3cX1vc3MOoitSUyQ__P4p_ZcLN4porG94DN38Vejmc";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allLinks = [];

        // INITIALISATION & VERIFICATION AUTH
        async function init() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                window.location.href = "prive.html";
            } else {
                fetchLinks();
            }
        }

        // RECUPERATION DES DONNÉES
        async function fetchLinks() {
            const { data: links, error } = await _supabase
                .from('links')
                .select('*')
                .order('category', { ascending: true });

            if (error) {
                console.error("Erreur de requête:", error);
                return;
            }
            
            allLinks = links;
            updateUI();
        }

        // MISE À JOUR DE L'INTERFACE
        function updateUI() {
            generateFilterButtons();
            renderLinks(allLinks);
        }

        // GENERATION DES BOUTONS DE FILTRE AVEC COMPTEURS
        function generateFilterButtons() {
            const filterBar = document.getElementById('filter-bar');
            const categories = [...new Set(allLinks.map(l => l.category))];
            
            filterBar.innerHTML = `<button onclick="filterLinks('ALL')" id="btn-ALL" class="filter-btn active-filter">TOUT <span class="category-badge">${allLinks.length}</span></button>`;
            
            categories.forEach(cat => {
                const count = allLinks.filter(l => l.category === cat).length;
                filterBar.innerHTML += `
                    <button onclick="filterLinks('${cat}')" id="btn-${cat}" class="filter-btn">
                        ${cat} <span class="category-badge">${count}</span>
                    </button>`;
            });
        }

        // LOGIQUE DE FILTRAGE
        function filterLinks(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active-filter'));
            const activeBtn = document.getElementById(`btn-${category}`);
            if(activeBtn) activeBtn.classList.add('active-filter');

            if (category === 'ALL') {
                renderLinks(allLinks);
            } else {
                const filtered = allLinks.filter(l => l.category === category);
                renderLinks(filtered);
            }
        }

        // RENDU DE LA GRILLE
        function renderLinks(linksToDisplay) {
            const container = document.getElementById('links-container');
            container.innerHTML = '';

            if (linksToDisplay.length === 0) {
                container.innerHTML = '<div class="col-span-full text-slate-500 italic text-center py-10 border border-dashed border-white/10 rounded-xl">Aucun point d\'accès détecté dans ce secteur.</div>';
                return;
            }

            linksToDisplay.forEach(link => {
                container.innerHTML += `
                    <div class="glass-card p-6 rounded-xl group flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-4">
                                <span class="text-[8px] font-bold text-cyan-400 border border-cyan-400/30 px-2 py-1 rounded uppercase tracking-tighter">${link.category}</span>
                                <button onclick="deleteLink(${link.id})" class="text-slate-600 hover:text-red-500 transition-colors p-1" title="Supprimer">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                            <a href="${link.url}" target="_blank" class="block group">
                                <h3 class="text-white font-bold text-lg mb-1 group-hover:text-cyan-400 transition-colors">${link.label}</h3>
                                <p class="text-[10px] text-slate-500 font-mono truncate mb-4">${link.url}</p>
                            </a>
                        </div>
                        <a href="${link.url}" target="_blank" class="mt-2 w-full py-2 bg-white/5 border border-white/10 text-center text-[9px] font-bold uppercase tracking-widest hover:bg-cyan-500 hover:text-black hover:border-cyan-500 transition-all rounded-md">
                            Établir la connexion <i class="fas fa-external-link-alt ml-2"></i>
                        </a>
                    </div>
                `;
            });
        }

        // INSERTION DE DONNÉES
        const form = document.getElementById('add-link-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = form.querySelector('button');
            btn.innerText = "Injection...";
            btn.disabled = true;

            const newLink = {
                label: document.getElementById('label').value,
                url: document.getElementById('url').value,
                category: document.getElementById('category').value.toUpperCase().trim()
            };

            const { error } = await _supabase.from('links').insert([newLink]);

            if (error) {
                alert("Échec de l'opération : " + error.message);
            } else {
                form.reset();
                await fetchLinks();
            }
            btn.innerText = "Injecter dans la BDD";
            btn.disabled = false;
        });

        // SUPPRESSION
        async function deleteLink(id) {
            if(confirm("Confirmer la suppression définitive de cette entrée ?")) {
                const { error } = await _supabase.from('links').delete().eq('id', id);
                if (!error) fetchLinks();
            }
        }

        // DECONNEXION
        async function logout() {
            await _supabase.auth.signOut();
            window.location.href = "prive.html";
        }

        window.onload = init;
    </script>
</body>
</html>
